apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: task-manager-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: task-manager.rules
      rules:
        - alert: HighHttpErrorRate
          expr: |
            sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m])) by (route)
            /
            sum(rate(http_request_duration_seconds_count[5m])) by (route)
            > 0.05
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "High 5xx error rate on {{ $labels.route }}"
            description: "More than 5% of requests to {{ $labels.route }} are failing with 5xx over the last 5 minutes."

        - alert: HighP95Latency
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket[5m])) by (le, route)
            ) > 1
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "p95 latency above 1s on {{ $labels.route }}"
            description: "95th percentile request latency for {{ $labels.route }} has exceeded 1 second for 10 minutes."

        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="app"}[15m]) > 3
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has restarted more than 3 times in 15 minutes."

        - alert: NoHealthyBackendReplicas
          expr: |
            kube_deployment_status_replicas_available{namespace="app", deployment=~".*-service"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.deployment }} has zero available replicas"
            description: "Deployment {{ $labels.deployment }} in namespace app has no available replicas."

        - alert: DatabaseConnectionPoolExhausted
          expr: |
            pg_stat_activity_count{datname="taskmanager"} / pg_settings_max_connections > 0.9
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "Postgres connection pool near exhaustion"
            description: "More than 90% of allowed Postgres connections are in use (requires postgres_exporter)."
