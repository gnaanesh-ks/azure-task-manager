# EXAMPLE ONLY — do not commit real secret values. In production, generate
# these via the Secrets Store CSI Driver or External Secrets Operator
# pulling from Azure Key Vault.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack-webhook
  namespace: monitoring
type: Opaque
stringData:
  warnings-url: "https://hooks.slack.com/services/REPLACE/ME/WARNINGS"
  critical-url: "https://hooks.slack.com/services/REPLACE/ME/CRITICAL"
---
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-pagerduty
  namespace: monitoring
type: Opaque
stringData:
  service-key: "REPLACE_WITH_PAGERDUTY_INTEGRATION_KEY"
