server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional in-cluster proxying if you prefer same-origin calls instead of
    # separate VITE_AUTH_API_URL / VITE_TASK_API_URL at build time.
    location /api/auth/ {
        proxy_pass http://auth-service:4000/api/auth/;
        proxy_set_header Host $host;
    }
    location /api/tasks/ {
        proxy_pass http://task-service:4001/api/tasks/;
        proxy_set_header Host $host;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
