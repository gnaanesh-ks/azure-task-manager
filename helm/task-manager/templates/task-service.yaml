apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-manager.fullname" . }}-task-service
  labels:
    app: task-service
spec:
  replicas: {{ .Values.taskService.replicas }}
  selector:
    matchLabels: { app: task-service }
  template:
    metadata:
      labels: { app: task-service }
    spec:
      containers:
        - name: task-service
          image: {{ include "task-manager.image" (dict "root" $ "repository" .Values.taskService.repository) }}
          ports:
            - containerPort: {{ .Values.taskService.port }}
          env:
            - name: PORT
              value: {{ .Values.taskService.port | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-manager.fullname" . }}-app-secrets
                  key: JWT_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "task-manager.fullname" . }}-app-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet: { path: /readyz, port: {{ .Values.taskService.port }} }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.taskService.port }} }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.taskService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
  labels:
    app: task-service
spec:
  selector: { app: task-service }
  ports:
    - name: http
      port: {{ .Values.taskService.port }}
      targetPort: {{ .Values.taskService.port }}
---
{{- if .Values.taskService.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "task-manager.fullname" . }}-task-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "task-manager.fullname" . }}-task-service
  minReplicas: {{ .Values.taskService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.taskService.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.taskService.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
