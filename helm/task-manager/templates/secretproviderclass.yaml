{{- if eq .Values.secrets.provider "keyvault" }}
{{- if not .Values.secrets.keyvault.name }}{{ fail "secrets.keyvault.name is required when secrets.provider=keyvault" }}{{- end }}
{{- if not .Values.secrets.keyvault.tenantId }}{{ fail "secrets.keyvault.tenantId is required when secrets.provider=keyvault" }}{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "task-manager.fullname" . }}-kv
  labels:
    app.kubernetes.io/part-of: task-manager
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: {{ .Values.serviceAccount.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.secrets.keyvault.name | quote }}
    tenantId: {{ .Values.secrets.keyvault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.secrets.keyvault.jwtSecretName }}
          objectType: secret
        - |
          objectName: {{ .Values.secrets.keyvault.databaseUrlSecretName }}
          objectType: secret
  secretObjects:
    - secretName: {{ include "task-manager.fullname" . }}-app-secrets
      type: Opaque
      data:
        - objectName: {{ .Values.secrets.keyvault.jwtSecretName }}
          key: JWT_SECRET
        - objectName: {{ .Values.secrets.keyvault.databaseUrlSecretName }}
          key: DATABASE_URL
{{- end }}
