{{- if eq .Values.secrets.provider "inline" }}
# provider: inline — credentials rendered straight into a Secret. Self-contained
# for a first end-to-end deployment. For production set secrets.provider=keyvault
# so JWT_SECRET / DATABASE_URL are synced from Azure Key Vault by the Secrets
# Store CSI Driver and never live in Git (see DEPLOYMENT.md step 6).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-manager.fullname" . }}-app-secrets
  labels:
    app.kubernetes.io/part-of: task-manager
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  DATABASE_URL: {{ include "task-manager.databaseUrl" . | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
{{- else if eq .Values.secrets.provider "keyvault" }}
# provider: keyvault — the {{ include "task-manager.fullname" . }}-app-secrets
# Secret is created and kept in sync by the Secrets Store CSI Driver from the
# SecretProviderClass in secretproviderclass.yaml. It materialises only once a
# pod that mounts the CSI volume is scheduled; until then workload pods that
# reference it stay in CreateContainerConfigError and recover automatically.
{{- else }}
{{ fail (printf "secrets.provider must be \"inline\" or \"keyvault\", got %q" .Values.secrets.provider) }}
{{- end }}
