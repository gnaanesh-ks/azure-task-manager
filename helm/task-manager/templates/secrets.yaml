# NOTE: for real production use, replace this raw Secret with either:
#   - the Azure Key Vault Provider for Secrets Store CSI Driver (mounts
#     Key Vault secrets as files / syncs them into a K8s Secret), or
#   - the External Secrets Operator with its Azure Key Vault provider
# so credentials never live in Git. Kept as a plain Secret here to keep the
# reference project self-contained.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "task-manager.fullname" . }}-app-secrets
  labels:
    app.kubernetes.io/part-of: task-manager
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  DATABASE_URL: {{ include "task-manager.databaseUrl" . | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
